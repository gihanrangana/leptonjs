<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hello</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: grid;
                place-items: center;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                background: #0b1021;
                color: #e6e6e6;
            }
            .card {
                text-align: center;
                padding: 2.5rem 3rem;
                border-radius: 16px;
                background: #11162a;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
                min-width: 320px;
            }
            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.6rem;
            }
            p {
                margin: 0.25rem 0;
                opacity: 0.7;
            }
            code {
                color: #7fd1ff;
            }
            input,
            button {
                padding: 0.4rem 0.6rem;
                border-radius: 8px;
                border: 1px solid #2a3550;
                background: #0b1021;
                color: #e6e6e6;
            }
            button {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Hello from LeptonJS Desktop</h1>
            <p>A native webview, powered by <code>Node.js</code> + IPC.</p>
            <p><input id="name" value="world" /> <button id="go">Greet</button></p>
            <p id="out">…</p>
            <p>tick: <span id="tick">0</span></p>
        </div>
        <script>
            window.__lepton.listen('tick', function (n) {
                document.getElementById('tick').textContent = String(n);
            });
            document.getElementById('go').addEventListener('click', async function () {
                var name = document.getElementById('name').value;
                try {
                    var greeting = await window.__lepton.invoke('getGreeting', name);
                    document.getElementById('out').textContent = greeting;
                } catch (e) {
                    document.getElementById('out').textContent = 'error: ' + e.message;
                }
            });
        </script>
    </body>
</html>
