[package]
name = "leptonjs-desktop-native"
version = "0.1.0-beta.4"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12", features = ["napi8"] }
napi-derive = "3.6"
wry = { version = "0.56", features = ["devtools"] }
tao = "0.36"

[build-dependencies]
napi-build = "2.4"

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
