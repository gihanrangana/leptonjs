name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches @leptonjs/core
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = '${{ github.ref_name }}'.TrimStart('v')
          $core = (Get-Content packages/core/package.json -Raw | ConvertFrom-Json).version
          if ($core -ne $expected) {
            throw "@leptonjs/core is '$core' but tag is 'v$expected'"
          }
          Write-Host "Tag v$expected matches @leptonjs/core"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm that supports trusted publishing
        run: npm install -g npm@11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> native/target
            host -> host/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native, host, and packages
        run: pnpm build

    #   - name: Publish unpublished @leptonjs packages
    #     run: node scripts/publish-unpublished.mjs
    #     env:
    #       NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
