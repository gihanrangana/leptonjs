name: Publish npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package versions
        shell: pwsh
        run: |
          $expected = '${{ github.ref_name }}'.TrimStart('v')
          $files = @('package.json') + (Get-ChildItem -Path packages -Filter package.json -Recurse -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $version = (Get-Content $file -Raw | ConvertFrom-Json).version
            if ($version -ne $expected) {
              throw "$file version '$version' does not match tag '$expected'"
            }
          }
          Write-Host "All package versions match $expected"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> native/target
            host -> host/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native, host, and packages
        run: pnpm build

      - name: Publish @leptonjs packages
        run: pnpm publish -r --filter "./packages/*" --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
